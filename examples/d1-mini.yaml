# Example for a common, cheap ESP8266 board (Wemos D1 Mini) wired to the
# AC's internal UART control board, with MQTT (Home Assistant discovery +
# an online/offline heartbeat) and full logging of the AC's own state.
# Pulls this component straight from GitHub - no manual download needed.
#
# 1. Download this one file.
# 2. Edit the CHANGE_ME values in the substitutions block below: your WiFi,
#    your MQTT broker, and the fallback-hotspot/OTA passwords.
# 3. Set `location` to whatever you want this unit called.
# 4. Flash: `esphome run d1-mini.yaml`

substitutions:
  location: "office"
  log_level: "ERROR"
  deviceid: "gree_ac_${location}"
  devicename: "Gree AC ${location}"
  # MQTT topic prefix - change to whatever you use, does not need to match anyone else's.
  tp: "home/ac/${location}"

  # ==== EDIT THESE BEFORE FLASHING ====
  wifi_ssid: "CHANGE_ME_WIFI_SSID"
  wifi_password: "CHANGE_ME_WIFI_PASSWORD"
  ap_password: "CHANGE_ME_FALLBACK_AP_PASSWORD"
  ota_password: "CHANGE_ME_OTA_PASSWORD"
  mqtt_broker: "CHANGE_ME_MQTT_BROKER"
  mqtt_username: "CHANGE_ME_MQTT_USERNAME"
  mqtt_password: "CHANGE_ME_MQTT_PASSWORD"

esphome:
  name: ${deviceid}

esp8266:
  board: d1_mini

logger:
  level: ${log_level}
  baud_rate: 0 # UART is used for the AC link, not the logger

api:
  reboot_timeout: 0s

ota:
  platform: esphome
  password: ${ota_password}

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  fast_connect: true
  ap:
    ssid: "${devicename} Fallback Hotspot"
    password: ${ap_password}

captive_portal:

mqtt:
  broker: ${mqtt_broker}
  port: 1883
  username: ${mqtt_username}
  password: ${mqtt_password}
  keepalive: 15s
  discovery: true
  discovery_prefix: homeassistant
  topic_prefix: ${tp}

  will_message:
    topic: "${tp}/status"
    payload: "offline"
    qos: 1
    retain: true

  on_connect:
    then:
      - lambda: |-
          id(mqtt_connected) = true;
          ESP_LOGI("mqtt", "== MQTT CONNECTED ==");
      - mqtt.publish:
          topic: "${tp}/status"
          payload: "online"
          qos: 1
          retain: true

  on_disconnect:
    then:
      - lambda: |-
          id(mqtt_connected) = false;
          ESP_LOGI("mqtt", "== MQTT DISCONNECTED ==");

globals:
  - id: mqtt_connected
    type: bool
    restore_value: no
    initial_value: 'false'

uart:
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 4800
  parity: EVEN

time:
  - platform: sntp

external_components:
  - source: github://iqdba/esphome_gree_hvac-extended
    components: [ gree ]
    refresh: 0s

climate:
  - platform: gree
    name: gree_ac
    id: gree_ac
    sleep:
      name: "${devicename} Sleep"
    display:
      name: "${devicename} Display"
    turbo:
      name: "${devicename} Turbo"
    louver:
      name: "${devicename} Louver"
    on_state:
      then:
        - lambda: |-
            auto fan_mode_opt = id(gree_ac).fan_mode;
            auto preset_opt = id(gree_ac).preset;

            ESP_LOGI("gree", "== GREE AC STATE ==");
            ESP_LOGI("gree", "Mode: %s", climate_mode_to_string(id(gree_ac).mode));

            if (fan_mode_opt.has_value()) {
              ESP_LOGI("gree", "Fan Mode: %s", climate_fan_mode_to_string(fan_mode_opt.value()));
            } else {
              ESP_LOGI("gree", "Fan Mode: UNKNOWN");
            }

            if (preset_opt.has_value()) {
              ESP_LOGI("gree", "Preset: %s", climate_preset_to_string(preset_opt.value()));
            } else {
              ESP_LOGI("gree", "Preset: UNKNOWN");
            }

            ESP_LOGI("gree", "Target Temp: %.1f", id(gree_ac).target_temperature);

interval:
  - interval: 600s
    then:
      - if:
          condition:
            lambda: 'return id(mqtt_connected);'
          then:
            - mqtt.publish:
                topic: "${tp}/status"
                payload: "online"
                qos: 1
                retain: true
