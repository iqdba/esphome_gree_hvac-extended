# Example for a common, cheap ESP8266 board (Wemos D1 Mini) wired to the
# AC's internal UART control board, with full logging of the AC's own state.
# Pulls this component straight from GitHub - no manual download needed.
#
# 1. Copy this file next to a `secrets.yaml` with the keys listed in
#    `secrets.yaml.example` (same folder) filled in with your own values.
# 2. Set `location` below to whatever you want this unit called.
# 3. Flash: `esphome run d1-mini.yaml`

substitutions:
  location: "office"
  log_level: "ERROR"
  deviceid: "gree_ac_${location}"
  devicename: "Gree AC ${location}"

esphome:
  name: ${deviceid}

esp8266:
  board: d1_mini

logger:
  level: ${log_level}
  baud_rate: 0 # UART is used for the AC link, not the logger

api:
  reboot_timeout: 0s

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  ap:
    ssid: "${devicename} Fallback Hotspot"
    password: !secret ap_password

captive_portal:

uart:
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 4800
  parity: EVEN

time:
  - platform: sntp

external_components:
  - source: github://iqdba/esphome_gree_hvac-extended
    components: [ gree ]
    refresh: 0s

climate:
  - platform: gree
    name: gree_ac
    id: gree_ac
    sleep:
      name: "${devicename} Sleep"
    display:
      name: "${devicename} Display"
    turbo:
      name: "${devicename} Turbo"
    louver:
      name: "${devicename} Louver"
    on_state:
      then:
        - lambda: |-
            auto fan_mode_opt = id(gree_ac).fan_mode;
            auto preset_opt = id(gree_ac).preset;

            ESP_LOGI("gree", "== GREE AC STATE ==");
            ESP_LOGI("gree", "Mode: %s", climate_mode_to_string(id(gree_ac).mode));

            if (fan_mode_opt.has_value()) {
              ESP_LOGI("gree", "Fan Mode: %s", climate_fan_mode_to_string(fan_mode_opt.value()));
            } else {
              ESP_LOGI("gree", "Fan Mode: UNKNOWN");
            }

            if (preset_opt.has_value()) {
              ESP_LOGI("gree", "Preset: %s", climate_preset_to_string(preset_opt.value()));
            } else {
              ESP_LOGI("gree", "Preset: UNKNOWN");
            }

            ESP_LOGI("gree", "Target Temp: %.1f", id(gree_ac).target_temperature);
